version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mrikipos-postgres
    restart: always
    environment:
      POSTGRES_USER: mrikipos
      POSTGRES_PASSWORD: mrikipos123
      POSTGRES_DB: mrikipos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrikipos -d mrikipos"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mrikipos-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
