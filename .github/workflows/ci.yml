name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting
        run: pnpm format:check

      - name: Build shared packages
        run: |
          pnpm --filter shared-types build
          pnpm --filter shared-utils build

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Lint (all packages)
        run: pnpm lint

      - name: Typecheck monorepo
        run: pnpm typecheck

      - name: Typecheck API (explicit)
        working-directory: apps/api
        run: node_modules/.bin/tsc -p tsconfig.json --noEmit --incremental false

      - name: Run API unit tests
        working-directory: apps/api
        run: node_modules/.bin/jest --passWithNoTests --forceExit

      - name: Build API
        working-directory: apps/api
        run: node_modules/.bin/nest build

      - name: Build Web
        working-directory: apps/web
        run: node_modules/.bin/next build

      - name: Route guard & workspace entrypoint tests
        run: |
          node scripts/verify-route-guard.mjs
          node scripts/verify-workspace-entrypoints.mjs
